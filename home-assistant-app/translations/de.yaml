configuration:
  digitalstrom_host:
    name: Adresse des digitalSTROM Servers
    description: IP-Adresse oder Hostname des digitalSTROM Servers.
  digitalstrom_port:
    name: Port des digitalSTROM Servers
    description: HTTPS-API-Port des digitalSTROM Servers. Standard ist 8080.
  digitalstrom_username:
    name: digitalSTROM Benutzername
    description: dSS-Benutzer zum Erstellen eines eigenen API-Schlüssels.
  digitalstrom_password:
    name: digitalSTROM Passwort
    description: Nur zum Erstellen oder Erneuern des API-Schlüssels nötig. Nach der Einrichtung geleert; das leere Feld bleibt sichtbar.
  mqtt_mode:
    name: MQTT-Verbindung
    description: Home Assistant MQTT service verwendet den vom Supervisor bereitgestellten Broker. Manual configuration verwendet die Felder unten, nicht die Einstellungen der MQTT-Integration.
  mqtt_host:
    name: Manuelle MQTT-Serveradresse
    description: Nur für Manual configuration. Hostname oder IP-Adresse ohne URL oder Port. Denselben Broker wie Home Assistant verwenden.
  mqtt_port:
    name: Manueller MQTT-Serverport
    description: Nur für Manual configuration. Unverschlüsseltes TCP im vertrauenswürdigen lokalen Netz; Standard 1883. TLS wird hier nicht unterstützt.
  mqtt_username:
    name: Manueller MQTT-Benutzername
    description: Nur für Manual configuration. Leer lassen, wenn der Broker keine Anmeldung verlangt.
  mqtt_password:
    name: Manuelles MQTT-Passwort
    description: Nur für Manual configuration. Wird für erneute Verbindungen gespeichert und im Gegensatz zum temporären digitalSTROM-Passwort nicht nach der Einrichtung geleert.
  invert_blinds_position:
    name: Storenposition umkehren
    description: Aktivieren, wenn 100 Prozent einen vollständig geschlossenen Store bedeuten soll.
  meterings_enabled:
    name: Verbrauchssensoren aktivieren
    description: digitalSTROM Verbrauchswerte über MQTT veröffentlichen.
  meterings_interval_seconds:
    name: Verbrauchsintervall
    description: Sekunden zwischen den Abfragen der digitalSTROM Verbrauchswerte.
  log_level:
    name: Log-Level
    description: Detailgrad der Einträge im App-Protokoll.
  regenerate_api_key:
    name: API-Schlüssel erneuern
    description: Beim nächsten Start einen neuen API-Schlüssel erstellen. Zuerst das digitalSTROM Passwort eingeben.
network:
  8080/tcp: Interner Gesundheitsendpunkt. Nur für eine direkte Diagnose freigeben.
