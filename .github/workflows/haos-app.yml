name: Home Assistant App CI and publish

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  HA_APP_IMAGE: ghcr.io/gaetancollaud/digitalstrom-mqtt-haos

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse App YAML
        run: |
          ruby - <<'RUBY'
          require "yaml"

          repository = YAML.load_file("repository.yaml")
          app = YAML.load_file("home-assistant-app/config.yaml")
          translations = %w[en de].map { |language| YAML.load_file("home-assistant-app/translations/#{language}.yaml") }

          abort "repository name is required" if repository.fetch("name").empty?
          abort "unexpected app architectures" unless app.fetch("arch") == %w[aarch64 amd64]
          abort "the App must require the MQTT service" unless app.fetch("services") == ["mqtt:need"]
          abort "the App must disable the Supervisor init wrapper" unless app.fetch("init") == false
          abort "the App must persist its own API key" unless app.fetch("schema").key?("digitalstrom_password")
          abort "a password option must be optional" unless app.fetch("schema").fetch("digitalstrom_password") == "password?"
          abort "forbidden host access requested" if app.key?("host_network") || app.key?("privileged") || app.key?("full_access")
          abort "missing translations" unless translations.all? { |translation| translation.fetch("configuration").keys.sort == app.fetch("schema").keys.sort }
          RUBY
      - name: Check App repository layout
        run: |
          test "$(find . -path ./.git -prune -o -type f -name config.yaml -print | wc -l)" -eq 1
          test -f home-assistant-app/config.yaml
      - name: Check App shell syntax
        run: bash -n home-assistant-app/run.sh .github/scripts/check-haos-app-version.sh
      - name: Require an App version bump for runtime changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: .github/scripts/check-haos-app-version.sh "${BASE_SHA}" "${GITHUB_SHA}"
      - name: Test App runtime bootstrap
        run: bash home-assistant-app/test-run.sh
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build amd64 App image
        run: |
          APP_VERSION="$(ruby -ryaml -e 'puts YAML.load_file("home-assistant-app/config.yaml").fetch("version")')"
          docker buildx build --platform linux/amd64 --build-arg BUILD_VERSION="${APP_VERSION}" --build-arg BUILD_ARCH=amd64 --file home-assistant-app/Dockerfile --load --tag digitalstrom-mqtt-haos:test-amd64 .
      - name: Build aarch64 App image
        run: |
          APP_VERSION="$(ruby -ryaml -e 'puts YAML.load_file("home-assistant-app/config.yaml").fetch("version")')"
          docker buildx build --platform linux/arm64 --build-arg BUILD_VERSION="${APP_VERSION}" --build-arg BUILD_ARCH=aarch64 --file home-assistant-app/Dockerfile --output type=cacheonly .

  publish:
    name: Publish Home Assistant App image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'gaetancollaud/digitalstrom-mqtt'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read App version
        id: app
        run: |
          APP_VERSION="$(ruby -ryaml -e 'puts YAML.load_file("home-assistant-app/config.yaml").fetch("version")')"
          PREVIOUS_VERSION="$(git show "${{ github.event.before }}:home-assistant-app/config.yaml" 2>/dev/null | ruby -ryaml -e 'puts YAML.safe_load(STDIN.read).fetch("version")' || true)"
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
          if [[ "${APP_VERSION}" == "${PREVIOUS_VERSION}" ]]; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            echo "Home Assistant App version ${APP_VERSION} is unchanged; skipping image publication."
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi
      - name: Set up QEMU
        if: steps.app.outputs.publish == 'true'
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: steps.app.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: steps.app.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push amd64 App image
        if: steps.app.outputs.publish == 'true'
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --build-arg BUILD_VERSION="${{ steps.app.outputs.version }}" \
            --build-arg BUILD_ARCH=amd64 \
            --file home-assistant-app/Dockerfile \
            --push \
            --tag "${HA_APP_IMAGE}-amd64:${{ steps.app.outputs.version }}" \
            .
      - name: Build and push aarch64 App image
        if: steps.app.outputs.publish == 'true'
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --build-arg BUILD_VERSION="${{ steps.app.outputs.version }}" \
            --build-arg BUILD_ARCH=aarch64 \
            --file home-assistant-app/Dockerfile \
            --push \
            --tag "${HA_APP_IMAGE}-aarch64:${{ steps.app.outputs.version }}" \
            .
      - name: Publish multi-architecture manifest
        if: steps.app.outputs.publish == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${HA_APP_IMAGE}:${{ steps.app.outputs.version }}" \
            "${HA_APP_IMAGE}-amd64:${{ steps.app.outputs.version }}" \
            "${HA_APP_IMAGE}-aarch64:${{ steps.app.outputs.version }}"
      - name: Verify anonymous App image access
        if: steps.app.outputs.publish == 'true'
        env:
          APP_VERSION: ${{ steps.app.outputs.version }}
        run: |
          REPOSITORY="${HA_APP_IMAGE#ghcr.io/}"
          if ! TOKEN_RESPONSE="$(
            curl --fail --silent --show-error --get 'https://ghcr.io/token' \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${REPOSITORY}:pull"
          )"; then
            echo 'GHCR did not grant anonymous pull access. Set the package visibility to public, then rerun this workflow.' >&2
            exit 1
          fi
          TOKEN="$(printf '%s' "${TOKEN_RESPONSE}" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("token")')"
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null \
            "https://ghcr.io/v2/${REPOSITORY}/manifests/${APP_VERSION}"; then
            echo 'The App image is not anonymously pullable. Set the GHCR package visibility to public, then rerun this workflow.' >&2
            exit 1
          fi
