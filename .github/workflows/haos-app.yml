name: Home Assistant App CI and publish

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "*"

permissions:
  contents: read

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  HA_APP_IMAGE_NAME: digitalstrom-mqtt-haos
  HA_APP_REGISTRY_PREFIX: ghcr.io/gaetancollaud

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse App YAML
        run: |
          ruby - <<'RUBY'
          require "yaml"

          repository = YAML.load_file("repository.yaml")
          app = YAML.load_file("home-assistant-app/config.yaml")
          translations = %w[en de].map { |language| YAML.load_file("home-assistant-app/translations/#{language}.yaml") }

          abort "repository name is required" if repository.fetch("name").empty?
          abort "unexpected app architectures" unless app.fetch("arch") == %w[aarch64 amd64]
          abort "the App must require the MQTT service" unless app.fetch("services") == ["mqtt:need"]
          abort "the App must disable the Supervisor init wrapper" unless app.fetch("init") == false
          abort "the App must be published as stable" unless app.fetch("stage") == "stable"
          abort "the App must persist its own API key" unless app.fetch("schema").key?("digitalstrom_password")
          abort "a password option must be optional" unless app.fetch("schema").fetch("digitalstrom_password") == "password?"
          abort "the health port must stay private" unless app.fetch("ports").fetch("8080/tcp").nil?
          abort "the App must expose its liveness check to the Supervisor watchdog" unless app.fetch("watchdog") == "http://[HOST]:[PORT:8080]/health/live"
          abort "forbidden host access requested" if app.key?("host_network") || app.key?("privileged") || app.key?("full_access")
          abort "missing translations" unless translations.all? { |translation| translation.fetch("configuration").keys.sort == app.fetch("schema").keys.sort }
          abort "missing health-port translations" unless translations.all? { |translation| translation.fetch("network").keys == ["8080/tcp"] }
          RUBY
      - name: Check App repository layout
        run: |
          test "$(find . -path ./.git -prune -o -type f -name config.yaml -print | wc -l)" -eq 1
          test -f home-assistant-app/config.yaml
          test -f home-assistant-app/README.md
          test -f home-assistant-app/DOCS.md
          test -f home-assistant-app/DOCS.de.md
          test -f home-assistant-app/CHANGELOG.md
          test -f home-assistant-app/apparmor.txt
          test -f home-assistant-app/icon.png
          test -f home-assistant-app/logo.png
      - name: Check App artwork
        run: |
          ruby - <<'RUBY'
          expected = {
            "home-assistant-app/icon.png" => [128, 128],
            "home-assistant-app/logo.png" => [250, 100],
          }

          expected.each do |path, dimensions|
            header = File.binread(path, 24)
            abort "#{path} is not a PNG file" unless header.start_with?("\x89PNG\r\n\x1a\n".b)
            actual = header.byteslice(16, 8).unpack("NN")
            abort "#{path} must be #{dimensions.join('x')}, got #{actual.join('x')}" unless actual == dimensions
          end
          RUBY
      - name: Check AppArmor profile
        run: |
          grep --fixed-strings '/data/** rwk,' home-assistant-app/apparmor.txt
          if ! command -v apparmor_parser >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes apparmor-utils
          fi
          apparmor_parser --skip-kernel-load --skip-cache home-assistant-app/apparmor.txt
      - name: Check App shell syntax
        run: |
          bash -n home-assistant-app/run.sh \
            .github/scripts/check-haos-app-release-version.sh \
            .github/scripts/test-check-haos-app-release-version.sh
      - name: Test App release version check
        run: bash .github/scripts/test-check-haos-app-release-version.sh
      - name: Match App version to release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/check-haos-app-release-version.sh "${GITHUB_REF_NAME}"
      - name: Test App runtime bootstrap
        run: bash home-assistant-app/test-run.sh

  prepare:
    name: Prepare App image matrix
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.app.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Read App version
        id: app
        run: |
          APP_VERSION="$(ruby -ryaml -e 'puts YAML.load_file("home-assistant-app/config.yaml").fetch("version")')"
          echo "version=${APP_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Prepare multi-architecture matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.HA_APP_IMAGE_NAME }}
          registry-prefix: ${{ env.HA_APP_REGISTRY_PREFIX }}

  build:
    name: Validate ${{ matrix.arch }} App image
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build App image without publishing
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: not-used-for-validation-build
          context: .
          cosign: "false"
          file: home-assistant-app/Dockerfile
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          push: "false"
          version: ${{ needs.prepare.outputs.version }}

  publish:
    name: Publish ${{ matrix.arch }} App image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'gaetancollaud/digitalstrom-mqtt'
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, sign, and publish App image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: .
          file: home-assistant-app/Dockerfile
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          push: "true"
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture App manifest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'gaetancollaud/digitalstrom-mqtt'
    needs:
      - prepare
      - publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Publish and sign multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.HA_APP_IMAGE_NAME }}
          image-tags: ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ env.HA_APP_REGISTRY_PREFIX }}
      - name: Verify anonymous App image access
        env:
          APP_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          HA_APP_IMAGE="${HA_APP_REGISTRY_PREFIX}/${HA_APP_IMAGE_NAME}"
          REPOSITORY="${HA_APP_IMAGE#ghcr.io/}"
          if ! TOKEN_RESPONSE="$(
            curl --fail --silent --show-error --get 'https://ghcr.io/token' \
              --data-urlencode 'service=ghcr.io' \
              --data-urlencode "scope=repository:${REPOSITORY}:pull"
          )"; then
            echo 'GHCR did not grant anonymous pull access. Set the package visibility to public, then rerun this workflow.' >&2
            exit 1
          fi
          TOKEN="$(printf '%s' "${TOKEN_RESPONSE}" | ruby -rjson -e 'puts JSON.parse(STDIN.read).fetch("token")')"
          if ! curl --fail --silent --show-error \
            --header "Authorization: Bearer ${TOKEN}" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            --output /dev/null \
            "https://ghcr.io/v2/${REPOSITORY}/manifests/${APP_VERSION}"; then
            echo 'The App image is not anonymously pullable. Set the GHCR package visibility to public, then rerun this workflow.' >&2
            exit 1
          fi
